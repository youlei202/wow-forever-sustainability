[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wow-forever-sustainability"
version = "0.1.0"
description = "Sequential equipment expansion research with explicit evidence scope"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.13", "PyYAML>=6", "matplotlib>=3.9"]

[project.optional-dependencies]
reproduce = ["pytest>=8", "nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6", "pandas>=2", "jupyterlab>=4"]
solvers = ["ortools>=9.10", "python-sat>=1.8.dev13"]

[project.scripts]
wowfs = "wowfs.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-p no:cacheprovider"
