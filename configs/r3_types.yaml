schema_version: 1
status: exploratory_source_vocabulary_not_experiment_freeze
engine:
  repository: https://github.com/sage3648/mythicsim-forever-engine
  commit: 17d75ccc8c67d027ae0088243ea3ee806d406847
  ruleset: RulesetForever
  interpretation: community_native_engine_not_live_server_certification
primary_hypothesis:
  unit_of_reuse: source_audited_control_kernel_with_reward_amplitude_coordinates
  not_sufficient: number_of_verbal_effect_type_labels
  exact_candidate: per_seed_affine_reward_with_unchanged_control_trace
  complexity_quantities:
    - number_of_distinct_control_kernels
    - number_of_context_task_policy_envelope_facets
    - reward_coordinate_dimension
    - domain_membership_and_kernel_dispatch_description
  rank_limitation: Low response rank does not bound the number of envelope facets.

character_scope:
  class: ClassWarrior
  races: [RaceHuman, RaceOrc]
  level: 60
  talents: 30305013-050520035150310051
  tasks: [sustained, short_burst, four_target, high_armor]
  policies: [native_no_reck, native_reck, rage_conserve]
  task_conditions:
    duration_based: true
    incoming_damage: false
    in_front_of_target: false
    external_buffs: false
  claim_scope: Finite native tasks and APL catalogue; no universal optimal-policy or defensive claim.

mechanism_vocabulary:
  weapon_reward:
    signature: [damage_min, damage_max, speed_seconds, hand_role, weapon_type, normalized_ap_speed]
    reward_coordinates: [damage_min, damage_max]
    control_coordinates: [speed_seconds, hand_role, weapon_type]
  triggered_damage:
    signature: [trigger_mask, landed_requirement, suppression_flags, ppm, school, defense_type, output_proc_mask, target_rule, damage_min, damage_max]
    reward_coordinates: [damage_min, damage_max]
    control_coordinates: [trigger_mask, landed_requirement, suppression_flags, ppm, defense_type, output_proc_mask, target_rule]
    qualification: School changes require a separate mitigation/kernel audit.
  periodic_damage:
    signature: [application_hit_rule, output_proc_mask, school, defense_type, amplitude_per_tick, tick_interval, number_of_ticks, refresh_rule, periodic_crit_rule]
    reward_coordinates: [amplitude_per_tick]
    control_coordinates: [application_hit_rule, output_proc_mask, tick_interval, number_of_ticks, refresh_rule, periodic_crit_rule]
  target_mitigation:
    signature: [school, resistance_change, duration, application_rule, max_targets, refresh_rule]
    reward_coordinates: []
    control_coordinates: [school, resistance_change, duration, application_rule, max_targets, refresh_rule]
  extra_attack:
    signature: [trigger_mask, trigger_probability, suppression_flags, offspring_count, hand_role, recursion_eligibility]
    reward_coordinates: []
    control_coordinates: [trigger_mask, trigger_probability, suppression_flags, offspring_count, hand_role, recursion_eligibility]
  active_stat_window:
    signature: [stat, magnitude, duration, cooldown, shared_cooldown, activation_policy]
    reward_coordinates: []
    control_coordinates: [stat, magnitude, duration, cooldown, shared_cooldown, activation_policy]
    qualification: A separately audited AP-only window may admit reward-only magnitude; no blanket assumption.
  active_resource:
    signature: [resource, amount, cap, cooldown, shared_cooldown, activation_policy]
    reward_coordinates: []
    control_coordinates: [resource, amount, cap, cooldown, shared_cooldown, activation_policy]

