candidate_affine_family:
  fixed_items: {main_hand: 12795, off_hand: 19019}
  coordinates:
    - {name: base_scale, hook: weapon_damage_scale, item_id: 12795, units: multiplier_of_native_min_and_max}
    - {name: dot_tick_damage, hook: periodic_damage_per_tick, item_id: 12795, units: raw_damage_per_tick}
    - {name: thunderfury_damage, hook: proc_damage, item_id: 19019, units: raw_damage_per_proc, optional: true}
  fixed_control:
    talon_speed_seconds: 1.3
    talon_ppm: 1.0
    talon_tick_interval_seconds: 3
    talon_number_of_ticks: 10
    thunderfury_speed_seconds: 1.9
    thunderfury_ppm: 6.0
    thunderfury_nature_resistance_reduction: 25
    registered_effects: unchanged_including_zero_amplitude
    stats_and_other_gear: fixed_per_explicit_kernel
  source_conditions:
    - No damage-dependent APL predicate or encounter termination.
    - No damage-dependent resource or trigger callback changes across the domain.
    - Block/clipping/positivity branches remain fixed across the domain.
    - Proc outcomes and random draw ordering remain identical under coupled seeds.
  falsification_metrics:
    - max_per_seed_affine_dps_residual
    - max_per_action_damage_residual
    - action_and_hit_crit_count_differences
    - aura_uptime_differences
    - resource_gain_actual_gain_and_waste_differences

transfer_design_proposal:
  status: requires_separate_immutable_protocol_before_fresh_heldout_combats
  development:
    family: fixed_control_talon_thunderfury_amplitude
    anchors: d_plus_one_affinely_independent_points_chosen_before_heldout_results
    proposed_base_dps_corners: [24, 54]
    proposed_dot_damage_corners: [0, 30]
    fixed_talon_speed_seconds: 1.3
    note: Four rectangle corners permit an interaction residual check beyond three-point affine identification.
  heldout_seen_family:
    family: fresh_numeric_amplitude_variants_of_same_registered_native_mechanics
    proposed_base_dps_interval: [26, 50]
    proposed_dot_damage_interval: [2, 28]
    generation: Fresh_random_numeric_points_seed_and_count_to_be_frozen_before_heldout_results.
    identity_note: These are research variants, not newly discovered official item IDs.
  heldout_within_verbal_type_new_control:
    changes: [weapon_speed, proc_ppm, dot_tick_interval, dot_number_of_ticks]
    proposed_speed_seconds: [1.45, 1.75, 2.35]
    proposed_proc_ppm: [0.7, 1.6]
    proposed_tick_interval_seconds: [2.3]
    prediction: Same type label does not justify reuse of old affine coefficients.
  heldout_new_mechanism:
    item_ids: [20130, 19951]
    families: [active_stat_window, active_resource]
    identity_note: IDs occurred in R2; withheld here only from R3 kernel fitting, not globally unseen.
  uncertainty:
    interpolation_and_native_confirmation: report_separately
    statistical_target: native_mean_DPS_not_worst_seed
    generic_baseline: same_features_same_anchors_same_kernel_membership_same_row_budget
  outcome_obligations: [P, N, D, L, H, C, attempted_candidates, rejected_candidates, failed_kernels]
  no_claims:
    - No fixed-type-count theorem without numerical and control-envelope assumptions.
    - No infinite positive-gap novelty in bounded finite-dimensional behavior space.
    - No claim of superiority to a generic method that contains the same rule.

physics_phase_proposal:
  status: development_response_surface_not_heldout_transfer
  talon_base_dps: [24, 28, 32, 36, 39.23076923076923, 42, 46, 50, 54]
  talon_speed_seconds: [1.0, 1.3, 1.6, 1.9, 2.2, 2.5, 2.8]
  speed_mode: hold_base_dps
  dot: {periodic_damage_per_tick: 10, tick_interval_seconds: 3, number_of_ticks: 10, proc_ppm: 1}
  off_hand_items: [871, 12590, 18816, 19019]
  trinket1_items: [11815, 19951]
  trinket2_items: [13965, 20130]
  thunderfury_parameters: unchanged_native
  race_contexts: [RaceHuman, RaceOrc]
