semantic_coordinates:
- expected_extra_mh_requests_per_eligible_event
- peak_attack_speed_increase
- direct_damage_max_per_proc
- temporary_physical_buff_family_count
- rage_return_or_discount_per_activation
- full_periodic_damage_per_proc
- maximum_target_armor_reduction
- unsupported_semantic_marker
coordinate_definitions:
  aggregation: Sum the eight per-item coordinates and triggered set-bonus coordinates. This is a source descriptor,
    not a certified combat upper bound.
  '0': Expected extra MH requests per eligible landed triggering event, PPM*base_weapon_speed/60*batch_size or fixed
    chance*batch_size; ICD retained separately.
  '1': Maximum native attack-speed multiplier minus one; sum is a descriptor, not the multiplicative combined multiplier.
  '2': Maximum unmitigated direct damage per proc summed over the native target cap, without crit; includes magical
    and physical schools.
  '3': Number of temporary physical stat/accuracy/crit/flat-damage buff effect families; raw strengths and durations
    remain in effect definitions.
  '4': Maximum flat rage returned or saved per activation; active rage and cost discount have distinct raw modes.
  '5': Full nominal periodic damage if all ticks occur once; overlap, refresh, resistance, and snapshotting alter
    realized damage.
  '6': Maximum raw target armor reduction; summing exclusive aura families can be loose.
  '7': Count of effects containing unsupported semantic components; no numerical danger label.
