    heal_min: 88
    heal_max_exclusive: 133
    input: landed_all_melee
    spell_id: 450589
    no_icd: true
rule_templates:
  q_values:
  - 2
  - 4
  - 8
  structured_rows: First q unit vectors in rule_feature_order, which includes the static proxy. Thus static power
    counts toward q.
  thresholds: For each active row, maximum score over the exact t=0 reference catalogue, computed once and frozen
    before first heldout response.
  threshold_slack: 0
  round_updates: Read and encode arriving public item only; never change rows, threshold, or dictionary.
  generic_baseline: Same q, same full features and source/log access, same initial feasible structured rows; arbitrary
    nonnegative row weights are allowed. Exact reproduction/ties are expected.
  unsupported_syntax: Must halt feature extraction as unresolved; never replace missing semantics with zeros.
  unsupported_semantics: The final unsupported marker is feature 9 and is not a rejection row at q=2/4/8. These
    effects remain admitted whenever the active rows permit; unsupported components are reported and tested, not
    silently assumed safe.
  zero_initial_feature: Threshold zero is a declared conservative policy; rejection of first new semantic family
    is policy behavior, not measured combat danger.
  safety_claim: Empirical finite-domain evaluation only; no source descriptor power certificate.
  q8_active_features:
  - static_strike_potential
  - expected_extra_mh_requests_per_eligible_event
  - peak_attack_speed_increase
  - direct_damage_max_per_proc
  - temporary_physical_buff_family_count
  - rage_return_or_discount_per_activation
  - full_periodic_damage_per_proc
  - maximum_target_armor_reduction
freeze_protocol:
  before_heldout_combat:
  - Freeze this catalogue, actual numeric rule thresholds, source hashes, target/task weights, novelty resolution,
    decision procedure, and mechanism parameter.
  - Choose native versus intervention panel and freeze gate cooldown at t=0; common native reference remains recorded.
  combat_seed_start: 98270001
  development_output_access_for_design: false
  source_only_design: true
  new_seed_confirmation_required: true
  response_adaptive_item_selection: false
  source_assumptions: Eight deterministic source-defined draws are not eight independent random game ecologies;
    report paired sequences and shared catalogues.
