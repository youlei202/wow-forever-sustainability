limitations:
- One arrival per round, below the requested 6–12 target; no hidden duplication of native IDs.
- No marginal-power matching of existing items; weak new rewards can fail quality and novelty.
- The fixed grammar permits parameter and weapon-stat changes, but the expanded grammar also changes power distributions;
  it is not a controlled causal estimate of semantic dimension.
- Only a subset of global game event semantics is represented by eight coordinates; unused defensive effects do
  not create a survival result.
- Source inspection selects hypotheses and items; no novel learning of source-known effect constants is claimed.
rule_feature_order:
- static_strike_potential
- expected_extra_mh_requests_per_eligible_event
- peak_attack_speed_increase
- direct_damage_max_per_proc
- temporary_physical_buff_family_count
- rage_return_or_discount_per_activation
- full_periodic_damage_per_proc
- maximum_target_armor_reduction
- unsupported_semantic_marker
static_strike_potential:
  definition: MH weapon DPS + 0.5 * OH weapon DPS + total item AttackPower / 14 + 2 * total item Strength / 14
  interpretation: Source-stat heuristic proxy, not actual character DPS or native combat upper bound; ignores accuracy,
    crit, armor, and dynamic state.
  feature_count: 1
  coefficient_scope: Fixed before heldout response; same proxy supplied to all methods.
