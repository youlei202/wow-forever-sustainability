causal_cases:
  - id: haste_extra
    equipment_overrides: {main_hand: 17112, off_hand: 12590, trinket1: 11815, legs: 22385}
    effect_a: {item_id: 17112}
    effect_b: {item_id: 11815}
    optional_effect_c: {item_id: 12590}
    hypothesis: Haste adds eligible melee events and flat per-swing rage; extra-attack proc has its own 2-second internal cooldown.
  - id: extra_resource
    equipment_overrides: {head: 21999, shoulder: 22001, wrist: 21996, chest: 21997, main_hand: 11684, off_hand: 871, trinket1: 11815, trinket2: 19951, legs: 22385}
    effect_a: {item_id: 11684}
    effect_b: {set_name: Battlegear of Heroism, pieces: 4}
    optional_effect_c: {item_id: 11815}
    hypothesis: Extra attacks add eligible set procs; returned rage permits special attacks, with rage cap and GCD/cooldown limits.
  - id: shared_active
    equipment_overrides: {main_hand: 17112, off_hand: 12590, trinket1: 20130, trinket2: 13965, legs: 14554}
    effect_a: {item_id: 20130}
    effect_b: {item_id: 14554}
    hypothesis: The two active stat effects share the offensive cooldown timer and cannot overlap under the native helper.
causal_contrast:
  pair: mu_AB_minus_mu_A_minus_mu_B_plus_mu_0
  triple: mu_ABC_minus_mu_AB_minus_mu_AC_minus_mu_BC_plus_mu_A_plus_mu_B_plus_mu_C_minus_mu_0
  semantics: Skip effect registration only; preserve all item IDs, weapon damage, speed, static stats, enchants, and other set tiers.
  optimize_after_intervention: Over the same enumerated legal configuration and strategy budget.
  inference_scope: Finite tested domains; selected effects are development hypotheses and must receive new-seed confirmation.

candidate_rules:
  status: hypotheses_only_not_frozen_test_rules
  no_item_id_exceptions: true
  same_information_generic_baseline: true
  semantic_features:
    - eligible_input_proc_mask
    - base_speed_per_event_proc_probability
    - output_extra_melee_event_count
    - output_flat_rage
    - haste_multiplier_and_aura_duration
    - internal_cooldown_seconds
    - shared_cooldown_resource
    - target_count_cap
  possible_templates:
    - Restrict expected offspring of eligible attack events, including special attacks and set-resource feedback.
    - Bound active-window occupancy on the shared offensive cooldown resource.
  excluded_claims:
    - Static attack power creates damage-proportional rage on Forever.
    - Nominal PPM alone is a per-minute upper bound under haste and special attacks.
    - The native engine globally blocks all recursive extra attacks.
    - A structured constraint family exceeds its same-dimension unrestricted superclass.
