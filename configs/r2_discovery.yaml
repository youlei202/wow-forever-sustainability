    source: ui/warrior/apls/dps_no_reck.apl.json
    transformation: none
  - id: native_reck
    source: ui/warrior/apls/dps_reck.apl.json
    transformation: none
  - id: rage_conserve
    source: ui/warrior/apls/dps_no_reck.apl.json
    transformation:
      description: Increase the rage reserve for queued attacks and filler without changing talent points or abilities.
      action_rage_thresholds:
        - spell_id: 25286
          tag: 1
          old: 40
          new: 70
        - spell_id: 20569
          tag: 1
          old: 40
          new: 70
        - spell_id: 7373
          old: 80
          new: 95

sampling:
  discovery_iterations: 32
  confirmation_iterations: [128, 512]
  confirmation_new_seeds: true
  discovery_seed_start: 24092401
  confirmation_seed_start: 92427001
  initial_pools: [frequency_extra, resource_heroism, burst_shared]
  expansion_gate: native_smoke_and_representative_effect_toggle_success
  exhaustive_per_pool: true
  configurations_per_pool_before_legality_filter: 16
  total_pools: 12
  denominator_note: Source-defined overlapping finite domains, not random independent equipment ecologies; report deduplicated physical configurations and pool incidences separately.

